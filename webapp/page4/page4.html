<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antigone - Statistics</title>
    <link rel="icon" href="data:,">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../shared/css/variables.css">
    <link rel="stylesheet" href="../shared/css/nav.css">
    <link rel="stylesheet" href="../shared/css/frame.css">
    <link rel="stylesheet" href="../shared/css/components.css">
    <link rel="stylesheet" href="../shared/css/utilities.css">
    <link rel="stylesheet" href="../shared/css/footer.css">
    <link rel="stylesheet" href="page4.css">
</head>
<body data-page="page4">

<nav id="nav-root"></nav>

<main class="stats-grid">

    <!-- KEY NUMBERS -->
    <div class="stats-summary">
        <div class="stat-card">
            <div class="stat-value" id="stat-triples">—</div>
            <div class="stat-label">Triples</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="stat-sections">—</div>
            <div class="stat-label">Sections</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="stat-characters">—</div>
            <div class="stat-label">Characters</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="stat-emotions">—</div>
            <div class="stat-label">Emotions</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="stat-lines">—</div>
            <div class="stat-label">Lines</div>
        </div>
    </div>

    <!-- HEATMAP -->
    <div class="frame heatmap-frame">
        <h3>Emotions by Section</h3>
        <div id="heatmap-container"></div>
    </div>

    <!-- NETWORK GRAPH -->
    <div class="frame network-frame" id="network-frame">
        <h3>Knowledge Network</h3>

        <div class="network-controls">
            <div class="level-row">
                <button class="level-btn active" data-level="1" title="Characters only">
                    <span class="level-num">1</span>
                    <span class="level-label">Characters</span>
                </button>
                <button class="level-btn" data-level="2" title="Add emotions">
                    <span class="level-num">2</span>
                    <span class="level-label">+ Emotions</span>
                </button>
                <button class="level-btn" data-level="3" title="Add themes">
                    <span class="level-num">3</span>
                    <span class="level-label">+ Themes</span>
                </button>
                <button class="level-btn" data-level="4" title="Add events">
                    <span class="level-num">4</span>
                    <span class="level-label">+ Events</span>
                </button>
                <button class="level-btn" data-level="5" title="Full detail with scenes">
                    <span class="level-num">5</span>
                    <span class="level-label">Full</span>
                </button>
            </div>
            <button class="fullscreen-btn" id="fullscreen-btn" title="Toggle fullscreen">
                <span class="fs-icon">⛶</span>
            </button>
        </div>

        <!-- Filter chips — appear only on Level 5 -->
        <div class="network-filters" id="network-filters" style="display:none;">
            <span class="filter-label">Show:</span>
            <button class="filter-chip active" data-filter="all">All</button>
            <button class="filter-chip" data-filter="character">Characters</button>
            <button class="filter-chip" data-filter="emotion">Emotions</button>
            <button class="filter-chip" data-filter="theme">Themes</button>
            <button class="filter-chip" data-filter="event">Events</button>
            <button class="filter-chip" data-filter="scene">Scenes</button>
        </div>

        <div id="network-container"></div>

        <!-- Legend + info compact, below the graph -->
        <div class="network-footer">
            <div class="network-legend" id="network-legend"></div>
            <div class="network-info" id="network-info"></div>
        </div>
    </div>

</main>

<script src="../shared/js/data.js"></script>
<script src="../shared/js/state.js"></script>
<script src="../shared/js/nav.js"></script>
<script src="page4.js"></script>
</body>
</html>
