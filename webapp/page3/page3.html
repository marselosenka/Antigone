<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antigone</title>
    <link rel="icon" href="data:,">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

    <!-- Stylesheets - order important -->
    <link rel="stylesheet" href="../shared/css/variables.css">
    <link rel="stylesheet" href="../shared/css/nav.css">
    <link rel="stylesheet" href="../shared/css/frame.css">
    <link rel="stylesheet" href="../shared/css/components.css">
    <link rel="stylesheet" href="../shared/css/utilities.css">
    <link rel="stylesheet" href="page3.css">
</head>
<body data-page="page3">

<!-- NAVIGATION BAR-->
<nav id="nav-root"></nav>

<!-- PAGE 3 – Semantics / Video-->
<main class="semantics-grid">

    <!-- Scenes (top bar) -->
    <div class="frame top-frame">
        <h3>Scenes</h3>
        <div id="scenes-container"></div>
    </div>

    <!-- Themes (left sidebar) -->
    <div class="frame left-frame">
        <h3>Themes</h3>
        <div id="themes-container"></div>
    </div>

    <!-- Characters (centre) -->
    <div class="center-frame">
        <div class="frame" style="flex:1; display:flex; flex-direction:column;">
            <h3 style="text-align:center;">Characters</h3>
            <div class="characters-grid" id="characters-container"></div>
            <p class="info-text">Click a character to focus related scenes and text</p>
        </div>
    </div>

    <!-- Events (right sidebar) -->
    <div class="frame right-frame">
        <h3>Events</h3>
        <div id="events-container"></div>
    </div>

    <!-- Video player -->
    <div class="video-container">
        <div class="video-player" id="video-player">
            <video id="video-element"
                   style="width:100%; height:100%; display:block;"
                   preload="auto">
                <source src="../antigone.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
            <div class="video-overlay">
                <span class="video-overlay-icon">▶</span>
            </div>

            <div class="video-controls">
                <button id="play-pause-btn" class="control-btn" title="Play/Pause">
                    <span id="play-icon">▶</span>
                </button>
                <div class="time-display">
                    <span id="current-time">00:00</span> / <span id="duration">00:00</span>
                </div>
                <input type="range" id="video-progress"
                       class="progress-bar" min="0" max="120" value="0" step="0.1">
                <button id="mute-btn"       class="control-btn" title="Mute/Unmute">🔊</button>
                <input  type="range" id="volume-control"
                        class="volume-slider" min="0" max="100" value="100">
                <button id="fullscreen-btn" class="control-btn" title="Fullscreen">⛶</button>
            </div>
        </div>
    </div>

    <!-- Emotions  -->
    <div class="frame bottom-frame">
        <h3>Emotions</h3>
        <div id="emotions-container"></div>
    </div>

</main>

<!--GLOBAL OVERLAYS-->
<button id="help-button" class="help-button" title="Keyboard Shortcuts">?</button>
<div id="keyboard-help" class="keyboard-help">
    <h4>Keyboard Shortcuts</h4>
    <ul>
        <li><span>Play / Pause</span>          <kbd>Space</kbd></li>
        <li><span>Seek −5s / +5s</span>        <kbd>←</kbd> / <kbd>→</kbd></li>
        <li><span>Select Character (Page 3)</span> <kbd>1</kbd> – <kbd>6</kbd></li>
        <li><span>Fullscreen</span>             <kbd>F</kbd></li>
        <li><span>Mute</span>                   <kbd>M</kbd></li>
        <li><span>Toggle Help</span>            <kbd>?</kbd></li>
    </ul>
</div>

<!-- SCRIPTS  (load order important) -->
<script src="../shared/js/data.js"></script>
<script src="../shared/js/state.js"></script>
<script src="../shared/js/render-helpers.js"></script>
<script src="../shared/js/nav.js"></script>
<script src="interactions.js"></script>
<script src="video-controls.js"></script>
<script src="page3.js"></script>
</body>
</html>
